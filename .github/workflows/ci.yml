name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/android
      - name: Validate project structure
        run: python3 .github/scripts/check_project.py
      - name: Test build scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test and lint release (no APK packaging)
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease
